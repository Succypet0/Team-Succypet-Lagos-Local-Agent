services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n
    ports:
      - "5678:5678"
    volumes:
      - ./workflow:/import
      - ./data:/data
    networks:
      - agent-network

  streamlit:
    build: .
    container_name: streamlit
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    networks:
      - agent-network
    depends_on:
      - n8n

networks:
  agent-network:
    driver: bridge